      name: "Resolve MiniPlaceholder"
      description: "Resolves MiniPlaceholders values for selected players."
  condition:
    players:
      name: "Player Count"
      description: "Checks the selected player count."
    worlds:
      name: "World Count"
      description: "Checks the selected world count."
    player_permission:
      name: "Player Permission"
      description: "Checks whether a selected player has a permission."
    world:
      name: "World"
      description: "Checks whether a world is selected."
    player_name_contains:
      name: "Player Name Contains"
