mre:
  event:
    example_broadcast:
      name: "Example Broadcast"
      description: "Broadcasts a configured message"
  action:
    select_players:
      name: "Select Players"
      description: "Selects online players for following actions"
    select_worlds:
      name: "Select Worlds"
      description: "Selects loaded worlds for following actions"
    clear_players:
      name: "Clear Players"
      description: "Clears selected players"
    clear_worlds:
      name: "Clear Worlds"
      description: "Clears selected worlds"
    message_players:
      name: "Message Players"
      description: "Sends message text to selected players"
    broadcast:
      name: "Broadcast"
      description: "Broadcasts message text to the server"
    execute_console_command:
      name: "Execute Console Command"
      description: "Executes as console; use {parameter}, ${parameter} or %parameter% to insert parameter container values"
    execute_player_command:
      name: "Player Command"
      description: "Executes a command as every selected player"
    heal_players:
      name: "Heal Players"
      description: "Heals selected players"
    damage_players:
      name: "Damage Players"
      description: "Damages selected players"
    clear_inventories:
      name: "Clear Inventories"
      description: "Clears selected player inventories"
    play_sound:
      name: "Play Sound"
      description: "Plays a sound for selected players"
    set_weather:
      name: "Set Weather"
      description: "Changes weather in selected worlds"
    stop_actions:
      name: "Stop Actions"
      description: "Stops the remaining actions in this event"
    skip_next_action:
      name: "Skip Next Action"
      description: "Skips the next action in this event"
  condition:
    players:
      name: "Player Count"
      description: "Checks the selected player count"
    worlds:
      name: "World Count"
      description: "Checks the selected world count"
    player_permission:
      name: "Player Permission"
      description: "Checks whether a selected player has a permission"
    world:
      name: "World"
      description: "Checks whether a world is selected"
    player_name_contains:
      name: "Player Name Contains"
      description: "Checks selected player names"
    world_name_contains:
      name: "World Name Contains"
      description: "Checks selected world names"
    server_online_players:
      name: "Server Online Players"
      description: "Checks the online player count"
    server_plugin_enabled:
      name: "Plugin Enabled"
      description: "Checks whether a plugin is enabled"
    server_plugin_disabled:
      name: "Plugin Disabled"
      description: "Checks whether a plugin is disabled"
    server_version_contains:
      name: "Server Version Contains"
      description: "Checks the server version"
    server_tps:
      name: "Server TPS"
      description: "Checks the server TPS"
    not:
      name: "Not"
      description: "Inverts the result of a nested condition"
    all_of:
      name: "All Conditions"
      description: "Passes when every nested condition passes"
    any_of:
      name: "Any Condition"
      description: "Passes when at least one nested condition passes"
  line:
    example:
      name: "Example Line"
      description: "Runs configured random events on a schedule"
command:
  about:
    - "<#D7B769>MittelRandomEvents"
    - "<#E5C779>Author: lijinhong11"
    - "<#A7BC9C>GitHub: <click:open_url:https://github.com/LinsMinecraftStudio/MittelRandomEvents>https://github.com/LinsMinecraftStudio/MittelRandomEvents</click>"
    - "<aqua>QQ Group: <click:open_url:https://qm.qq.com/q/qJEqZZxVNm>1107921027</click>"
    - "<dark_purple>Discord: <click:open_url:https://discord.gg/9YP2UaPZhE>https://discord.gg/9YP2UaPZhE</click>"
  help:
    general:
      - "<#D7B769>MittelRandomEvents Help"
      - "<#E5C779>/mre help <#8EA08C>- <#A7BC9C>Show this help"
      - "<#E5C779>/mre help events <#8EA08C>- <#A7BC9C>Show event help"
      - "<#E5C779>/mre help lines <#8EA08C>- <#A7BC9C>Show line help"
      - "<#E5C779>/mre about <#8EA08C>- <#A7BC9C>Show plugin info"
      - "<#E5C779>/mre gui <#8EA08C>- <#A7BC9C>Open the GUI"
      - "<#E5C779>/mre events list <#8EA08C>- <#A7BC9C>List all events"
      - "<#E5C779>/mre lines list <#8EA08C>- <#A7BC9C>List all lines"
      - "<#E5C779>/mre reload <#8EA08C>- <#A7BC9C>Reload the plugin"
    events:
      - "<#D7B769>MittelRandomEvents Event Help"
      - "<#E5C779>/mre events list <#8EA08C>- <#A7BC9C>List all events"
      - "<#E5C779>/mre events info <id> <#8EA08C>- <#A7BC9C>Show event info"
      - "<#E5C779>/mre events create <id> [displayName] <#8EA08C>- <#A7BC9C>Create an event"
      - "<#E5C779>/mre events delete <id> <#8EA08C>- <#A7BC9C>Delete an event"
      - "<#E5C779>/mre events set <id> enabled <true|false> <#8EA08C>- <#A7BC9C>Set event enabled state"
      - "<#E5C779>/mre events set <id> display-name <displayName> <#8EA08C>- <#A7BC9C>Set event display name"
      - "<#E5C779>/mre events set <id> icon <material> <#8EA08C>- <#A7BC9C>Set event icon"
    lines:
      - "<#D7B769>MittelRandomEvents Line Help"
      - "<#E5C779>/mre lines list <#8EA08C>- <#A7BC9C>List all lines"
      - "<#E5C779>/mre lines info <id> <#8EA08C>- <#A7BC9C>Show line info"
      - "<#E5C779>/mre lines create <id> <intervalSeconds> <#8EA08C>- <#A7BC9C>Create a line"
      - "<#E5C779>/mre lines delete <id> <#8EA08C>- <#A7BC9C>Delete a line"
      - "<#E5C779>/mre lines add-event <line> <event> <seconds> <weight> <#8EA08C>- <#A7BC9C>Add an event to a line"
      - "<#E5C779>/mre lines set <id> interval <seconds> <#8EA08C>- <#A7BC9C>Set line interval"
      - "<#E5C779>/mre lines set <id> cron <expression> <#8EA08C>- <#A7BC9C>Set line Cron schedule"
      - "<#E5C779>/mre lines set <id> display-name <displayName> <#8EA08C>- <#A7BC9C>Set line display name"
      - "<#E5C779>/mre lines set <id> icon <material> <#8EA08C>- <#A7BC9C>Set line icon"
      - "<#E5C779>/mre lines start <id> <#8EA08C>- <#A7BC9C>Start a line"
      - "<#E5C779>/mre lines stop <id> <#8EA08C>- <#A7BC9C>Stop a line"
      - "<#E5C779>/mre lines run <id> <#8EA08C>- <#A7BC9C>Run a line once"
  reload:
    success: "Reloaded random events and lines."
  error:
    material: "Unknown material."
    unknown: "Unknown %type%."
  events:
    list: "Events (%count%): %events%"
    info: "Event %id% enabled=%enabled% actions=%actions% conditions=%conditions%"
