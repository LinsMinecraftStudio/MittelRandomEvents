mre:
  event:
    example_broadcast:
      name: "Example Broadcast"
      description: "Broadcasts a configured message."
  action:
    select_players:
      name: "Select Players"
      description: "Selects online players for following actions."
    select_worlds:
      name: "Select Worlds"
      description: "Selects loaded worlds for following actions."
    clear_players:
      name: "Clear Players"
      description: "Clears selected players."
    clear_worlds:
      name: "Clear Worlds"
      description: "Clears selected worlds."
    resolve_placeholder:
      name: "Resolve Placeholder"
      description: "Resolves PlaceholderAPI values for selected players."
