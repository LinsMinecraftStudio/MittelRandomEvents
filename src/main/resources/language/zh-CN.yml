mre:
  action:
    select_players:
      name: "选择玩家"
      description: "选择后续动作使用的在线玩家"
    select_worlds:
      name: "选择世界"
      description: "选择后续动作使用的已加载世界"
    clear_players:
      name: "清空玩家选择"
      description: "清除已选择的玩家"
    clear_worlds:
      name: "清空世界选择"
      description: "清除已选择的世界"
    message_players:
      name: "发送玩家消息"
      description: "向选中的玩家发送消息文本"
    broadcast:
      name: "全服广播"
      description: "向服务器广播消息文本"
    execute_console_command:
      name: "执行控制台命令"
      description: "以控制台身份执行命令；支持使用 {参数名}、${参数名} 或 %参数名% 插入参数容器中的变量"
    execute_player_command:
      name: "玩家命令"
      description: "以每个选中玩家身份执行命令"
    heal_players:
      name: "治疗玩家"
      description: "治疗选中的玩家"
    damage_players:
      name: "伤害玩家"
      description: "对选中的玩家造成伤害"
    clear_inventories:
      name: "清空背包"
      description: "清空选中玩家的背包"
    play_sound:
      name: "播放声音"
      description: "为选中的玩家播放声音"
    set_weather:
      name: "设置天气"
      description: "修改选中世界的天气"
    stop_actions:
      name: "停止后续动作"
      description: "停止执行当前事件剩余动作"
    skip_next_action:
      name: "跳过下个动作"
      description: "跳过当前事件的下一个动作"
  condition:
    players:
      name: "玩家数量"
      description: "检查已选择的玩家数量"
    worlds:
      name: "世界数量"
      description: "检查已选择的世界数量"
    player_permission:
      name: "玩家权限"
      description: "检查已选择的玩家是否拥有权限"
    world:
      name: "世界"
      description: "检查是否选择了指定世界"
    player_name_contains:
      name: "玩家名称包含"
      description: "检查已选择的玩家名称"
    world_name_contains:
      name: "世界名称包含"
      description: "检查已选择的世界名称"
    server_online_players:
      name: "服务器在线玩家"
      description: "检查服务器在线玩家数量"
    server_plugin_enabled:
      name: "插件已启用"
      description: "检查插件是否已启用"
    server_plugin_disabled:
      name: "插件已禁用"
      description: "检查插件是否已禁用"
    server_version_contains:
      name: "服务器版本包含"
      description: "检查服务器版本文本"
    server_tps:
      name: "服务器 TPS"
      description: "检查服务器 TPS"
    not:
      name: "条件取反"
      description: "反转嵌套条件的判断结果"
    all_of:
      name: "全部条件"
      description: "所有嵌套条件通过时成立"
    any_of:
      name: "任一条件"
      description: "至少一个嵌套条件通过时成立"
