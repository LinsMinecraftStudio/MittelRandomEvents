command:
  about:
    name: "MittelRandomEvents %version%"
    description: "随机事件与事件线管理插件。"
  reload:
    success: "随机事件和事件线已重新加载。"
  error:
    material: "未知的物品材质。"
    unknown: "未知的%type%。"
  events:
    list: "事件（%count%）：%events%"
    info: "事件 %id% 启用=%enabled% 动作=%actions% 条件=%conditions%"
    exists: "事件已存在。"
    create: "已创建事件 %id%。"
    delete: "已删除事件 %id%。"
    set:
      enabled: "已更新事件启用状态。"
      display-name: "已更新事件显示名称。"
      icon: "已更新事件图标。"
  lines:
    list: "事件线（%count%）：%lines%"
    info: "事件线 %id% 间隔=%interval% Cron=%cron% 事件数=%events% 运行中=%running%"
    exists: "事件线已存在。"
    create: "已创建事件线 %id%。"
    delete: "已删除事件线 %id%。"
    add-event:
      exists: "该事件已经添加到事件线。"
      success: "已将事件 %event% 添加到事件线 %line%。"
    set:
      interval: "已更新事件线间隔。"
      cron: "已更新事件线 Cron 表达式。"
      display-name: "已更新事件线显示名称。"
      icon: "已更新事件线图标。"
    start: "已启动事件线 %id%。"
    stop: "已停止事件线 %id%。"
    run: "已单次运行事件线 %id%。"
gui:
